<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ray Arayilakath</title>
  <style>
    :root {
      color-scheme: light;
      color: #161616;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body, figure, h1, p { margin: 0; }
    body { background: #eeeeec; }
    @media (hover: hover) and (pointer: fine) {
      html, body { overflow: hidden; overscroll-behavior: none; }
    }
    main {
      --paper: url("orchid/paper.webp");
      --blue: #274be2;
      /* Interpolate the stacked phone and side-by-side desktop plates.
         On shallow screens the flower's width is also limited by the height. */
      --stacked: 0;
      --margin: max(clamp(4.3vw, calc(3vw + 1.25svh), 5.6vw), calc(env(safe-area-inset-left, 0px) + 8px));
      --name-size: min(16svh, clamp(7.5vw, 6.65svh + .7vw, 15.45vw) + clamp(0px, 6vw - 7.4svh, 1.1vw));
      --name-leading: clamp(0px, calc(19px - .20em), 9px);
      --name-top: max(clamp(3.8svh, .63svh + 6.6vw, 6.9svh), calc(env(safe-area-inset-top, 0px) + 12px));
      --below-name: calc(6px + max(min(22svh, 55vw), var(--name-top) + 2 * var(--name-size) + .12 * var(--photo-w) + max(18px, 4vw)));
      --photo-gutter: clamp(12px, 3.25vw, 46px);
      /* In a tall portrait, the cut specimen sits above the footer. */
      --footer-type: clamp(25px, 6.2vw, 34px);
      --footer-room: max(var(--photo-gutter), var(--margin) + 4.25 * var(--footer-type) + 14px - max(0px, 57svh - 64vw));
      --landscape-cap: clamp(67svh, 127svh - 24vw, 88svh);
      --specimen-size: calc(clamp(47vw, 36svh + 13vw, 86vw) + clamp(0px, 32vw - 40svh, 8vw) + clamp(0px, 15svh - 20vw, 5vw));
      /* The film has 48 additional paper units on the right for the bud at full sway. */
      --film-width: 1.046875;
      --film-span: min(var(--landscape-cap), var(--specimen-size), 100vw - 2 * var(--photo-gutter), (100vw - var(--footer-room) - var(--photo-gutter)) / .78);
      --photo-w: calc(var(--film-span) / var(--film-width));
      --photo-x: min(100vw - var(--film-span) - var(--photo-gutter), 49vw);
      --portrait-center: calc((100svh + var(--name-top) + 2 * var(--name-size) - clamp(68px, 10svh, 94px) - 1.47 * var(--photo-w)) / 2);
      --photo-y: max(3.6svh, min(7svh, 13svh - 6vw), min(49svh - 42vw, var(--below-name)), var(--portrait-center) - max(0px, 67vw - 34svh));
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      position: relative;
      background: #fcfcfa;
    }
    .identity, .callout, .ring { z-index: 1; }
    main::after {
      z-index: 2;
      content: "";
      position: absolute;
      inset: 0;
      background: var(--paper) center / 410px 410px;
      mix-blend-mode: multiply;
      opacity: .78;
      pointer-events: none;
    }
    .art-motion, .specimen {
      position: absolute; inset: 0;
      pointer-events: none;
    }
    .art-motion {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .plate-origin {
      position: absolute; left: var(--photo-x); top: var(--photo-y);
      width: var(--photo-w); aspect-ratio: 2 / 3;
    }
    @media (max-aspect-ratio: 6/5) {
      .plate-origin {
        /* One angled cut for the still and film. Reveal the longer stem as the poster widens. */
        --stem-reveal: max(0px, 130vw - 122svh);
        clip-path: polygon(0 0, 105% 0, 105% calc(97% + var(--stem-reveal)),
          34% calc(97% + var(--stem-reveal)), 27% calc(99% + var(--stem-reveal)), 0 calc(99% + var(--stem-reveal)));
      }
    }
    .imprint, .reversal, .toner { position: absolute; inset: 0; }
    .imprint {
      background: #fff;
      mix-blend-mode: multiply;
    }
    .reversal {
      background: #f8f8f8;
      mix-blend-mode: difference;
      clip-path: var(--ink-shape, polygon(70% 0, 100% 0, 100% 100%, 70% 100%));
    }
    .toner {
      clip-path: var(--steps, polygon(70% 0, 100% 0, 100% 100%, 70% 100%));
      background: var(--paper) center / 235px 235px;
      filter: invert(1) brightness(1.9);
      mix-blend-mode: screen;
      opacity: .78;
    }
    @supports (-webkit-touch-callout: none) {
      @media (pointer: coarse) and (display-mode: browser) {
        /* Safari samples the document behind its toolbars. Snap to the poster
           so its controls stay visible while the print extends above and below. */
        html { overflow: hidden; scroll-snap-type: y mandatory; }
        body {
          --bleed: max(150px, calc(100lvh - 100svh));
          padding-block: var(--bleed);
          overflow: clip;
        }
        main { scroll-snap-align: start; overflow: visible; }
        main::before {
          content: "";
          position: absolute;
          inset: 0;
          background: #fcfcfa;
        }
        main::before, main::after, .reversal, .toner {
          inset-block: calc(0px - var(--bleed));
        }
      }
    }
    .drafting {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; mix-blend-mode: difference;
    }
    h1 > span { display: block; width: max-content; }
    a {
      color: inherit; text-decoration-thickness: 1px; text-underline-offset: .16em;
      position: relative;
    }
    a::after { content: ""; position: absolute; inset: -13px -2px; }
    @media (hover: hover) and (pointer: fine) {
      a:hover { color: var(--blue); }
    }
    a:focus-visible { color: var(--blue); outline: 1px solid currentColor; outline-offset: .2em; }
  </style>
